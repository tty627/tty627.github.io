# Minimal Fluid overrides. Theme defaults remain in the npm package so upgrades
# can bring new defaults instead of being shadowed by a copied 40 KB config.

favicon: /assets/favicon.svg
apple_touch_icon: /assets/avatar.svg
force_https: false

custom_head: '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.min.css" media="print" onload="this.media=''all''"><noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.min.css"></noscript>'

fun_features:
  typing:
    enable: false
  progressbar:
    enable: false

dark_mode:
  enable: true
  default: auto

color:
  body_bg_color: "#f9f7f2"
  body_bg_color_dark: "#0f1420"
  navbar_bg_color: "#f9f7f2"
  navbar_bg_color_dark: "#0f1420"
  navbar_text_color: "#1b2029"
  navbar_text_color_dark: "#eef1f7"
  subtitle_color: "#1b2029"
  subtitle_color_dark: "#eef1f7"
  text_color: "#1b2029"
  text_color_dark: "#eef1f7"
  sec_text_color: "#6a7282"
  sec_text_color_dark: "#8e9bb2"
  board_color: "rgba(255, 253, 249, 0.84)"
  board_color_dark: "rgba(21, 28, 44, 0.8)"
  post_text_color: "#3f4756"
  post_text_color_dark: "#c8d0df"
  post_heading_color: "#1b2029"
  post_heading_color_dark: "#f1f4fa"
  post_link_color: "#2c679c"
  post_link_color_dark: "#e8be66"
  link_hover_color: "#1f4e79"
  link_hover_color_dark: "#f6d487"
  line_color: "#e6e0d4"
  line_color_dark: "#263147"

font:
  font_size: 16px
  font_family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif'
  letter_spacing: 0
  code_font_size: 88%

custom_css:
  - /css/theme-overrides.css

custom_js:
  - /js/theme-accessibility.js

canonical:
  enable: true

lazyload:
  enable: true
  onlypost: false

navbar:
  blog_title: "Tianye Tan"
  ground_glass:
    enable: true
    px: 16
    alpha: 0.84
  menu:
    - { name: "项目", link: "/projects/", icon: "iconfont icon-code" }
    - { name: "关于", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: false
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

banner:
  random_img: false
  parallax: false
  width_height_ratio: 0

scroll_down_arrow:
  enable: false

scroll_top_arrow:
  enable: false

open_graph:
  enable: true
  twitter_card: summary

footer:
  content: '<div class="fluid-footer-shell"><span>© 2026 Tianye Tan</span><nav aria-label="页脚链接"><a href="/">首页</a><a href="/projects/">项目</a><a href="/files/tianye-tan-resume.pdf" target="_blank" rel="noopener">简历</a><a href="https://github.com/tty627" target="_blank" rel="noopener">GitHub</a><a href="mailto:ttyinzg@gmail.com">Email</a></nav></div>'
  statistics:
    enable: false
  beian:
    enable: false

# /notes/ uses Fluid's index layout.
index:
  banner_img: /assets/backdrop-roxy.jpg
  banner_img_height: 30
  banner_mask_alpha: 0
  slogan:
    enable: true
    text: "文章"
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: false
    tag: false

post:
  banner_img: /assets/backdrop-roxy.jpg
  banner_img_height: 30
  banner_mask_alpha: 0
  meta:
    author:
      enable: false
    date:
      enable: true
      format: "YYYY-MM-DD"
    wordcount:
      enable: false
    min2read:
      enable: false
      awl: 2
      wpm: 60
  updated:
    enable: false
  category_bar:
    enable: false
  toc:
    enable: false
  copyright:
    enable: false
  prev_next:
    enable: false

archive:
  banner_img: /assets/backdrop-roxy.jpg
  banner_img_height: 26
  banner_mask_alpha: 0

category:
  enable: true
  banner_img: /assets/backdrop-roxy.jpg
  banner_img_height: 26
  banner_mask_alpha: 0

tag:
  enable: true
  banner_img: /assets/backdrop-roxy.jpg
  banner_img_height: 26
  banner_mask_alpha: 0

about:
  enable: true
  banner_img: /assets/backdrop-roxy.jpg
  banner_img_height: 32
  banner_mask_alpha: 0
  avatar: /assets/avatar-github.jpg
  name: "谭天晔"
  intro: "上科大 CS 大二 · 硅基流动开发实习 · Kaggle"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/tty627", tip: "GitHub" }
    - { class: "iconfont icon-mail", link: "mailto:ttyinzg@gmail.com", tip: "Gmail" }
    - { class: "iconfont icon-mail", link: "mailto:tanty2025@shanghaitech.edu.cn", tip: "ShanghaiTech Email" }

page:
  banner_img: /assets/backdrop-roxy.jpg
  banner_img_height: 28
  banner_mask_alpha: 0

page404:
  enable: true
  banner_img: /assets/backdrop-roxy.jpg
  banner_img_height: 70
  banner_mask_alpha: 0.1
  redirect_delay: 0

links:
  enable: false
