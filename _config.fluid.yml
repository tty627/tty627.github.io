# Minimal Fluid overrides. Theme defaults remain in the npm package so upgrades
# can bring new defaults instead of being shadowed by a copied 40 KB config.

favicon: /assets/favicon.svg
apple_touch_icon: /assets/avatar.svg
force_https: true

fun_features:
  typing:
    enable: false
  progressbar:
    enable: false

dark_mode:
  enable: true
  default: auto

color:
  body_bg_color: "#f7f7f4"
  body_bg_color_dark: "#11110f"
  navbar_bg_color: "#f7f7f4"
  navbar_bg_color_dark: "#11110f"
  navbar_text_color: "#181816"
  navbar_text_color_dark: "#f1f1ec"
  subtitle_color: "#181816"
  subtitle_color_dark: "#f1f1ec"
  text_color: "#181816"
  text_color_dark: "#f1f1ec"
  sec_text_color: "#6d6e67"
  sec_text_color_dark: "#9b9c95"
  board_color: "#f7f7f4"
  board_color_dark: "#11110f"
  post_text_color: "#464640"
  post_text_color_dark: "#cecec7"
  post_heading_color: "#181816"
  post_heading_color_dark: "#f1f1ec"
  post_link_color: "#0b6b5f"
  post_link_color_dark: "#76c9bc"
  link_hover_color: "#084f47"
  link_hover_color_dark: "#91d9cc"
  line_color: "#dedfd9"
  line_color_dark: "#2d2e2a"

font:
  font_size: 16px
  font_family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif'
  letter_spacing: 0
  code_font_size: 88%

custom_css:
  - /css/theme-overrides.css

custom_js:
  - /js/theme-accessibility.js

canonical:
  enable: true

lazyload:
  enable: true
  onlypost: false

navbar:
  blog_title: "Tianye Tan"
  ground_glass:
    enable: true
    px: 14
    alpha: 0.92
  menu:
    - { name: "项目", link: "/projects/", icon: "iconfont icon-code" }
    - { name: "文章", link: "/notes/", icon: "iconfont icon-archive-fill" }
    - { name: "关于", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: false
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

banner:
  random_img: false
  parallax: false
  width_height_ratio: 0

scroll_down_arrow:
  enable: false

scroll_top_arrow:
  enable: false

open_graph:
  enable: true
  twitter_card: summary

footer:
  content: '<div class="fluid-footer-shell"><span>© 2026 Tianye Tan</span><nav aria-label="页脚链接"><a href="/about/">关于</a><a href="/files/tianye-tan-resume.pdf" target="_blank" rel="noopener">简历</a><a href="https://github.com/tty627" target="_blank" rel="noopener">GitHub</a><a href="mailto:ttyinzg@gmail.com">Email</a></nav></div>'
  statistics:
    enable: false
  beian:
    enable: false

# /notes/ uses Fluid's index layout.
index:
  banner_img: /assets/banner.svg
  banner_img_height: 24
  banner_mask_alpha: 0
  slogan:
    enable: true
    text: "文章"
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: false
    tag: false

post:
  banner_img: /assets/banner.svg
  banner_img_height: 28
  banner_mask_alpha: 0
  meta:
    author:
      enable: false
    date:
      enable: true
      format: "YYYY-MM-DD"
    wordcount:
      enable: false
    min2read:
      enable: false
      awl: 2
      wpm: 60
  updated:
    enable: false
  category_bar:
    enable: false
  toc:
    enable: false
  copyright:
    enable: false
  prev_next:
    enable: false

archive:
  banner_img: /assets/banner.svg
  banner_img_height: 22
  banner_mask_alpha: 0

category:
  enable: true
  banner_img: /assets/banner.svg
  banner_img_height: 22
  banner_mask_alpha: 0

tag:
  enable: true
  banner_img: /assets/banner.svg
  banner_img_height: 22
  banner_mask_alpha: 0

about:
  enable: true
  banner_img: /assets/banner.svg
  banner_img_height: 22
  banner_mask_alpha: 0
  avatar: /assets/avatar.jpg
  name: "谭天晔"
  intro: "上海科技大学计算机本科生 · LLM Agent 评测与开发工具"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/tty627", tip: "GitHub" }
    - { class: "iconfont icon-mail", link: "mailto:ttyinzg@gmail.com", tip: "Gmail" }
    - { class: "iconfont icon-mail", link: "mailto:tanty2025@shanghaitech.edu.cn", tip: "ShanghaiTech Email" }

page:
  banner_img: /assets/banner.svg
  banner_img_height: 22
  banner_mask_alpha: 0

page404:
  enable: true
  banner_img: /assets/banner.svg
  banner_img_height: 70
  banner_mask_alpha: 0.2
  redirect_delay: 0

links:
  enable: false
