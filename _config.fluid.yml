# Minimal Fluid overrides. Theme defaults remain in the npm package so upgrades
# can bring new defaults instead of being shadowed by a copied 40 KB config.

favicon: /assets/favicon.svg
apple_touch_icon: /assets/avatar.svg
force_https: true

fun_features:
  typing:
    enable: false
  progressbar:
    enable: true
    height_px: 2
    color: "#20b8a6"

dark_mode:
  enable: true
  default: auto

color:
  body_bg_color: "#f3f1ea"
  body_bg_color_dark: "#0a101b"
  navbar_bg_color: "#101827"
  navbar_bg_color_dark: "#070c14"
  navbar_text_color: "#f6f2e8"
  navbar_text_color_dark: "#e6edf5"
  subtitle_color: "#f6f2e8"
  subtitle_color_dark: "#e6edf5"
  text_color: "#172033"
  text_color_dark: "#d9e1ea"
  sec_text_color: "#667085"
  sec_text_color_dark: "#98a6b7"
  board_color: "#fffdf8"
  board_color_dark: "#111a29"
  post_text_color: "#273248"
  post_text_color_dark: "#d5dde7"
  post_heading_color: "#111827"
  post_heading_color_dark: "#f4f7fb"
  post_link_color: "#08766f"
  post_link_color_dark: "#43d5c3"
  link_hover_color: "#a94d00"
  link_hover_color_dark: "#ffbb66"
  line_color: "#dfe3e8"
  line_color_dark: "#2b3748"

font:
  font_size: 16px
  font_family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif'
  letter_spacing: 0
  code_font_size: 88%

custom_css:
  - /css/theme-overrides.css

custom_js:
  - /js/theme-accessibility.js

canonical:
  enable: true

lazyload:
  enable: true
  onlypost: false

navbar:
  blog_title: "Tianye Tan"
  ground_glass:
    enable: true
    px: 10
    alpha: 0.86
  menu:
    - { name: "Home", link: "/", icon: "iconfont icon-home-fill" }
    - { name: "Writing", link: "/notes/", icon: "iconfont icon-archive-fill" }
    - { name: "About", link: "/about/", icon: "iconfont icon-user-fill" }

search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

banner:
  random_img: false
  parallax: false
  width_height_ratio: 0

scroll_down_arrow:
  enable: false

open_graph:
  enable: true
  twitter_card: summary

footer:
  content: '© 2026 Tianye Tan · Built as a record of work, evidence, and lessons.'
  statistics:
    enable: false
  beian:
    enable: false

# /notes/ uses Fluid's index layout.
index:
  banner_img: /assets/banner.svg
  banner_img_height: 44
  banner_mask_alpha: 0.2
  slogan:
    enable: true
    text: "Writing on experiments, failures, and systems."
  auto_excerpt:
    enable: true
  post_url_target: _self
  post_meta:
    date: true
    category: true
    tag: true

post:
  banner_img: /assets/banner.svg
  banner_img_height: 42
  banner_mask_alpha: 0.2
  meta:
    author:
      enable: false
    date:
      enable: true
      format: "YYYY-MM-DD"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 60
  updated:
    enable: false
  copyright:
    enable: true
    license: BY-NC-SA

archive:
  banner_img: /assets/banner.svg
  banner_img_height: 34
  banner_mask_alpha: 0.2

category:
  enable: true
  banner_img: /assets/banner.svg
  banner_img_height: 34
  banner_mask_alpha: 0.2

tag:
  enable: true
  banner_img: /assets/banner.svg
  banner_img_height: 34
  banner_mask_alpha: 0.2

about:
  enable: true
  banner_img: /assets/banner.svg
  banner_img_height: 34
  banner_mask_alpha: 0.2
  avatar: /assets/avatar.svg
  name: "谭天晔 · Tianye Tan"
  intro: "Computer Science @ ShanghaiTech · Class of 2029"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/tty627", tip: "GitHub" }
    - { class: "iconfont icon-mail", link: "mailto:tanty2025@shanghaitech.edu.cn", tip: "Email" }

page:
  banner_img: /assets/banner.svg
  banner_img_height: 34
  banner_mask_alpha: 0.2

page404:
  enable: true
  banner_img: /assets/banner.svg
  banner_img_height: 70
  banner_mask_alpha: 0.2
  redirect_delay: 0

links:
  enable: false
