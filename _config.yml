# Site
title: 谭天晔 · Tianye Tan
subtitle: ""
description: 谭天晔（tty627）的个人主页，记录大模型 Agent 评测实习、公开项目和开发笔记。
keywords:
  - Tianye Tan
  - 谭天晔
  - LLM evaluation
  - developer tools
  - ShanghaiTech
author: Tianye Tan
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://tty627.github.io/
root: /
permalink: notes/:title/
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Keep GitHub Pages from running Jekyll over generated assets.
include:
  - .nojekyll
exclude:
ignore:

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: tty627.github.io
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: "  "
  wrap: true
  hljs: false

# Publish the chronological post index under /notes/; / is a custom portfolio.
index_generator:
  path: notes
  per_page: 10
  order_by: -date

# Taxonomy
default_category: Notes
category_map:
tag_map:

# Metadata and dates
meta_generator: true
date_format: YYYY-MM-DD
time_format: HH:mm
# CI checkout time must not masquerade as an editorial update.
updated_option: empty

# Pagination
per_page: 10
pagination_dir: page

# Preserve useful URLs while the young site adopts stable slugs.
alias:
  2026/08/12/Hello-World/index.html: notes/index.html
  2026/08/13/2026-08-14-github-projects/index.html: /#work

sitemap:
  path: sitemap.xml
  template: ./sitemap-template.xml
  rel: false
  tags: false
  categories: false

theme: fluid
